<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>官网鉴定局 · 本地布局验收</title>
<style>body{margin:0;background:#ddd;font:14px system-ui;color:#333}header{height:45px;display:flex;align-items:center;justify-content:center;gap:12px}a{color:inherit}iframe{display:block;border:0;margin:0 auto;background:#f7f7f7;box-shadow:0 0 0 1px #bbb}p{margin:0}#host-capsule{display:none;position:absolute;width:88px;height:32px;border:1px solid #999;border-radius:20px;background:#f7f7f7cc;z-index:5;pointer-events:none}#host-capsule svg{width:100%;height:100%}</style></head>
<body><header><span>本地布局验收</span><a href="?width=360">360</a><a href="?width=390">390</a><a href="?width=430">430</a><a href="?width=1024">桌面</a></header><iframe title="游戏界面"></iframe><div id="host-capsule" aria-hidden="true"><svg viewBox="0 0 88 32"><g fill="#333"><circle cx="14" cy="16" r="2"/><circle cx="21" cy="16" r="3"/><circle cx="28" cy="16" r="2"/></g><path d="M43 6V26" stroke="#999"/><circle cx="65" cy="16" r="7" fill="none" stroke="#333" stroke-width="2"/><circle cx="65" cy="16" r="3" fill="#333"/></svg></div>
<script type="module">
  const params = new URL(location.href).searchParams;
  const width = Number(params.get('width'));
  const height = Number(params.get('height'));
  const frame = document.querySelector('iframe');
  frame.width = [360,390,393,430,1024].includes(width) ? width : 390;
  frame.height = [560,600,640,660,800,852].includes(height) ? height : 660;
  const safeTop = Math.min(160, Math.max(0, Number(params.get('safeTop')) || 0));
  const safeBottom = Math.min(100, Math.max(0, Number(params.get('safeBottom')) || 0));
  frame.addEventListener('load', () => {
    const root = frame.contentDocument.documentElement;
    root.style.setProperty('--host-safe-top', `${safeTop}px`);
    root.style.setProperty('--host-safe-bottom', `${safeBottom}px`);
  });
  if (safeTop) {
    const capsule = document.querySelector('#host-capsule');
    capsule.style.cssText = `display:block;left:calc(50% + ${Number(frame.width) / 2 - 98}px);top:${45 + Math.max(0, safeTop - 44)}px`;
  }
  frame.src = params.get('screen') === 'long-game' ? './qa-game.html' : './';
</script></body></html>
